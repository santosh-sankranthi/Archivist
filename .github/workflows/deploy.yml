name: Deploy

# Self-hosted pipeline — runs ON the WSL box that serves the demo (runner label
# "archivist-deploy"). Trigger scope is deliberately narrow: pushes to main and
# manual dispatch only. The work itself lives in ci/deploy.sh.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: [self-hosted, archivist-deploy]
    outputs:
      live_url: ${{ steps.live.outputs.url }}
    steps:
      - id: live
        name: Resolve live URL
        run: |
          U="$(journalctl --user -u archivist-tunnel --no-pager -o cat 2>/dev/null | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' | tail -1)"
          if [ -n "$U" ]; then
            echo "url=${U}/console" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://github.com/santosh-sankranthi/Archivist" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: prepare
    runs-on: [self-hosted, archivist-deploy]
    environment:
      name: production
      url: ${{ needs.prepare.outputs.live_url }}
    timeout-minutes: 45
    steps:
      - name: Pull (fast-forward only)
        run: /home/openclaw/projects/archivist/ci/deploy.sh pull "$GITHUB_SHA"
      - name: Test gates
        run: /home/openclaw/projects/archivist/ci/deploy.sh test
      - name: Apply (rebuild if needed, restart, smoke)
        run: /home/openclaw/projects/archivist/ci/deploy.sh apply
      - name: Report (live URL)
        run: /home/openclaw/projects/archivist/ci/deploy.sh report
