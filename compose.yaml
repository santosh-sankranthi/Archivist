# Archivist — full local stack: FalkorDB + console/agent server.
#
#   docker compose up -d --build        -> http://127.0.0.1:8787/console/
#
# Ingest repositories from ./data (mounted read-only at /data), or mount any
# checkout for one command:
#   docker compose run --rm app python scripts/ingest.py --repo /data/flask --graph repo:flask
#   docker compose run --rm -v /abs/path/to/repo:/repo:ro app \
#     python scripts/ingest.py --repo /repo --graph repo:mytool
#
# Knobs: ARCHIVIST_PORT (console host port), FALKORDB_PORT (database host
# port — set it if a local FalkorDB already holds 6379), ARCHIVIST_GRAPH
# (graph served; restart the app when the name changes). ARCHIVIST_LLM_* in
# .env enables the ask room; without a key it stays an honest 503.
name: archivist

services:
  falkordb:
    image: falkordb/falkordb:v4.22.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6379}:6379"
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ARCHIVIST_PORT:-8787}:8787"
    volumes:
      - ./data:/data:ro
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      ARCHIVIST_GRAPH: ${ARCHIVIST_GRAPH:-repo:flask}
      ARCHIVIST_LLM_BASE_URL: ${ARCHIVIST_LLM_BASE_URL:-}
      ARCHIVIST_LLM_API_KEY: ${ARCHIVIST_LLM_API_KEY:-}
      ARCHIVIST_LLM_MODEL: ${ARCHIVIST_LLM_MODEL:-}

volumes:
  falkordb-data:
