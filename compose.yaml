# Archivist — full local stack: FalkorDB + console/agent server.
#
#   docker compose up -d --build        -> http://127.0.0.1:8787/console/
#
# ./data is read-write: it holds the shared demo checkout *and* the account
# store (data/accounts, data/users/<uid>). Mount any other checkout for one
# command:
#   docker compose run --rm -v /abs/path/to/repo:/repo:ro app \
#     python scripts/ingest.py --repo /repo --graph repo:mytool
#
# Knobs: ARCHIVIST_PORT (console host port), FALKORDB_PORT (database host
# port — set it if a local FalkorDB already holds 6379), ARCHIVIST_GRAPH /
# ARCHIVIST_DEMO_GRAPH (shared graph served; restart when names change),
# ARCHIVIST_SIGNUP=open|closed, ARCHIVIST_MAX_REPOS. ARCHIVIST_LLM_* in .env
# enables the ask room; without a key it stays an honest 503.
name: archivist

services:
  falkordb:
    image: falkordb/falkordb:v4.22.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6379}:6379"
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ARCHIVIST_PORT:-8787}:8787"
    volumes:
      - ./data:/data
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      ARCHIVIST_DATA_DIR: /data
      ARCHIVIST_GRAPH: ${ARCHIVIST_GRAPH:-repo:flask}
      ARCHIVIST_DEMO_GRAPH: ${ARCHIVIST_DEMO_GRAPH:-repo:flask}
      ARCHIVIST_SIGNUP: ${ARCHIVIST_SIGNUP:-open}
      ARCHIVIST_MAX_REPOS: ${ARCHIVIST_MAX_REPOS:-2}
      ARCHIVIST_LLM_BASE_URL: ${ARCHIVIST_LLM_BASE_URL:-}
      ARCHIVIST_LLM_API_KEY: ${ARCHIVIST_LLM_API_KEY:-}
      ARCHIVIST_LLM_MODEL: ${ARCHIVIST_LLM_MODEL:-}

volumes:
  falkordb-data:
